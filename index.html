  <script>
    const pokemonList = ["Pikachu", "Schiggy", "Bisasam", "Glumanda", "Evoli", "Relaxo", "Mewtu", "Gengar", "Lucario", "Karpador", "Arktos", "Zapdos", "Lavados", "Pummeluff", "Taubsi"];
    
    let activeDeck = [];
    let currentIndex = 0;
    let score = 0;
    let streak = 0;
    let roundsCompleted = 0;
    let isListening = false;

    const wordDisplay = document.getElementById('wordDisplay');
    const heardDisplay = document.getElementById('heardDisplay');
    const scoreDisplay = document.getElementById('score');
    const trophiesDisplay = document.getElementById('trophies');
    const multiBadge = document.getElementById('multiBadge');
    const streakText = document.getElementById('streakText');
    const actionBtn = document.getElementById('actionBtn');
    const exitBtn = document.getElementById('exitBtn');

    // Web Speech API Prüfung
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (!SpeechRecognition) {
      heardDisplay.textContent = "Fehler: Web Speech API wird nicht unterstützt!";
      heardDisplay.style.color = "red";
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = 'de-DE';
      recognition.continuous = false;
      recognition.interimResults = true; // Auf true gesetzt, damit Zwischenergebnisse direkt sichtbar sind

      recognition.onstart = () => {
        isListening = true;
        actionBtn.textContent = "🎙️ HÖRE ZU...";
        actionBtn.classList.add('listening');
        heardDisplay.style.color = "#718096";
        heardDisplay.textContent = "Spritzt / Sprich jetzt...";
      };

      recognition.onresult = (event) => {
        let transcript = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        
        const cleanText = transcript.trim().toLowerCase().replace(/[.,?!]/g, '');
        heardDisplay.textContent = `Gehört: "${cleanText}"`;

        if (event.results[0].isFinal) {
          checkWord(cleanText);
        }
      };

      recognition.onerror = (event) => {
        console.error("Sprachfehler:", event.error);
        isListening = false;
        actionBtn.textContent = "🎙️ SPRECHEN";
        actionBtn.classList.remove('listening');
        
        if (event.error === 'not-allowed') {
          heardDisplay.textContent = "Fehler: Mikrofon-Zugriff verweigert!";
          heardDisplay.style.color = "red";
        } else if (event.error === 'no-speech') {
          heardDisplay.textContent = "Nichts gehört. Noch einmal versuchen.";
        } else {
          heardDisplay.textContent = `Fehler: ${event.error}`;
        }
      };

      recognition.onend = () => {
        isListening = false;
        actionBtn.textContent = "🎙️ SPRECHEN";
        actionBtn.classList.remove('listening');
      };
    }

    function shuffle(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getMultiplier() {
      if (streak >= 5) return 3;
      if (streak >= 3) return 2;
      return 1;
    }

    function updateUI() {
      const multi = getMultiplier();
      multiBadge.textContent = `${multi}x Multi`;
      multiBadge.className = multi > 1 ? 'multiplier-badge active' : 'multiplier-badge';
      streakText.textContent = `SERIE: ${streak} IN FOLGE 🔥`;
      
      let trophyIcons = '';
      for(let i = 0; i < roundsCompleted; i++) trophyIcons += '🏆';
      trophiesDisplay.textContent = trophyIcons;
    }

    function nextWord() {
      if (currentIndex >= activeDeck.length) {
        activeDeck = shuffle(pokemonList);
        currentIndex = 0;
        roundsCompleted++;
      }
      
      wordDisplay.textContent = activeDeck[currentIndex];
      wordDisplay.classList.remove('correct-flash');
      heardDisplay.textContent = "";
      updateUI();
    }

    function checkWord(spokenText) {
      const target = activeDeck[currentIndex].toLowerCase();

      if (spokenText === target || spokenText.includes(target) || target.includes(spokenText)) {
        streak++;
        score += (1 * getMultiplier());
        scoreDisplay.textContent = score;
        
        wordDisplay.classList.add('correct-flash');
        
        setTimeout(() => {
          currentIndex++;
          nextWord();
        }, 700);
      }
    }

    // Direktes Ausführen des Mikrofon-Starts ohne Konflikt mit Fullscreen
    actionBtn.addEventListener('click', () => {
      if (!recognition) return;

      // Vollbild im Hintergrund anfordern
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      if (isListening) {
        try {
          recognition.stop();
        } catch(e) {}
      } else {
        try {
          recognition.start();
        } catch (e) {
          console.error("Start-Fehler:", e);
        }
      }
    });

    exitBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (document.fullscreenElement) {
        document.exitFullscreen();
      }
    });

    activeDeck = shuffle(pokemonList);
    nextWord();
  </script>
